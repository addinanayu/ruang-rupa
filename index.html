<!DOCTYPE html>
<html lang="id">
<!-- Ruang Rupa v2.22 -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruang Rupa Interaktif</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- v2.22: A-Frame dan Firebase tidak lagi menahan halaman. Keduanya dimuat setelah kotak login tampil (lihat muatSekali di skrip utama). -->
<style>
  :root { --ink:#1d2a2f; --paper:#f7f5f0; --accent:#2f6f8f; --warn:#b3412f; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; color:var(--ink); }
  .ui { position:fixed; z-index:10; background:var(--paper); border-radius:6px; padding:14px; box-shadow:0 2px 12px #0004; }
  #hud { top:10px; left:10px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #hud button { padding:6px 10px; }
  #login, #lobi { inset:0; margin:auto; width:min(360px,90vw); height:fit-content; }
  #lobi { display:none; }
  #tombolGoogle { display:flex; justify-content:center; margin-top:12px; min-height:44px; }
  #studio { right:10px; top:60px; width:min(300px,90vw); display:none; max-height:calc(100dvh - 76px); overflow:auto; box-sizing:border-box; }
  #hasil button { position:sticky; bottom:0; }
  #studio label { display:block; margin:6px 0 2px; font-weight:600; }
  #studio input, #studio select { width:100%; padding:6px; box-sizing:border-box; }
  #studio img { width:100%; margin-top:8px; border-radius:4px; }
  #pesan { bottom:10px; left:10px; max-width:80vw; display:none; }
  button { cursor:pointer; padding:8px 12px; border:0; border-radius:4px; background:var(--accent); color:#fff; }
  button.alt { background:#6b7a80; }
  #avatars button[aria-pressed="true"] { outline:3px solid var(--ink); }
  @media (pointer:coarse){ button { min-height:44px; } }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid #f2b705; }
</style>
</head>
<body>

<div id="login" class="ui">
  <h2 style="margin:0 0 8px">Ruang Rupa Interaktif</h2>
  <p style="margin:0">Masuk dengan akun Google mana pun (Gmail atau akun sekolah).</p>
  <div id="tombolGoogle"></div>
  <p id="infoLogin" style="margin:10px 0 0;color:var(--warn);font-size:13px"></p>
</div>

<div id="lobi" class="ui">
  <h2 style="margin:0 0 4px">Ruang Rupa Interaktif</h2>
  <p id="akun" style="margin:0 0 8px;font-size:13px;color:#555"></p>
  <label for="nama">Nama panggilan</label>
  <input id="nama" maxlength="20" style="width:100%;padding:6px;box-sizing:border-box">
  <div id="kelasBox" style="display:none"><label for="kelas">Kelas</label>
  <select id="kelas" style="width:100%;padding:6px;box-sizing:border-box"></select></div>
  <p>Pilih avatar</p>
  <div id="avatars" style="display:flex;gap:8px"></div>
  <p><button id="masuk">Masuk pameran</button> <button id="keluar" class="alt">Ganti akun</button></p>
</div>

<div id="hud" class="ui" style="display:none">
  <button data-zona="A">Lorong Apresiasi</button>
  <button data-zona="C">Studio AI</button>
  <button data-zona="D">Galeri Karya Siswa</button>
  <span id="pager" style="display:none;gap:4px;align-items:center"><button id="prev" aria-label="Halaman sebelumnya">&lsaquo;</button><span id="hal">1/1</span><button id="next" aria-label="Halaman berikutnya">&rsaquo;</button></span>
</div>

<div id="studio" class="ui" role="dialog" aria-label="Studio Desain AI">
  <label for="tema">Tema</label><input id="tema" placeholder="mis. pasar pagi di Kediri">
  <label for="aliran">Aliran seni</label>
  <select id="aliran"><option>Impresionisme</option><option>Kubisme</option><option>Ekspresionisme</option><option>Batik kontemporer</option><option>Surealisme</option></select>
  <label for="palet">Palet warna</label>
  <select id="palet"><option>hangat (oranye, kuning, merah)</option><option>dingin (biru, hijau, ungu)</option><option>monokrom</option><option>warna komplementer</option></select>
  <label for="detail">Detail tambahan</label><input id="detail">
  <p><button id="buat">Buat gambar</button></p>
  <div id="hasil"></div>
</div>
<div id="pesan" class="ui" role="status"></div>
<div id="memuat" role="status" aria-live="polite" style="display:none;position:fixed;inset:0;z-index:30;background:rgba(29,42,47,.88);color:#fff;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:20px">Menyiapkan museum...</div>
<div id="ver" style="position:fixed;left:8px;bottom:2px;z-index:5;font-size:11px;opacity:.65;pointer-events:none">v2.22</div>

<!-- v2.22: markup scene disuntikkan oleh pasangScene() SETELAH A-Frame dimuat. A-Frame yang dimuat belakangan tidak bisa menginisialisasi <a-scene> yang sudah ada di halaman (anak didaftarkan sebelum induk). -->
<template id="tplScene"><a-scene id="scene" embedded style="position:fixed;inset:0;background:#dfe6e8" renderer="antialias:true" background="color:#dfe6e8" vr-mode-ui="enabled:false" cursor="rayOrigin:mouse" raycaster="objects:.klik">
  <a-entity light="type:ambient;intensity:0.7"></a-entity>
  <a-entity light="type:directional;intensity:0.6" position="2 6 3"></a-entity>
  <a-plane rotation="-90 0 0" position="0 -0.47 0" width="80" height="80" color="#cfc7b8"></a-plane>
  <a-entity id="dunia"></a-entity>
  <a-entity id="rig" position="0 0 6" wasd-controls="acceleration:22">
    <a-camera id="cam" near="0.08" far="200" wasd-controls-enabled="false" look-controls="magicWindowTrackingEnabled:false"></a-camera>
  </a-entity>
  <a-entity id="lain"></a-entity>
</a-scene></template>

<script>
/* ===== KONFIGURASI (isi sebelum dipakai) ===== */
// URL web app Apps Script (berakhiran /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbxqRNXm_MW0zoQc8X5g0GSLXtbcsW_HaCuY2d8wZIEuKc9u-fPuusTEku-G70KUvWEDuA/exec';
// OAuth Client ID (tipe Web application) dari Google Cloud Console
const GOOGLE_CLIENT_ID = '826616122681-5uhithq0tib20nrmeq9i2qlahh5mdpoo.apps.googleusercontent.com';
// Firebase (kosongkan databaseURL untuk mematikan multiplayer)
const FB = { apiKey:'', authDomain:'ruang-rupa.firebaseapp.com', databaseURL:'https://ruang-rupa-default-rtdb.asia-southeast1.firebasedatabase.app', projectId:'ruang-rupa' };
/* ============================================= */

const VERSI = '2.22';   // harus sama dengan nomor di Code.gs (VERSI_)
const AVATAR = [['Merah','#c0392b'],['Biru','#2f6f8f'],['Hijau','#3f7d4f'],['Kuning','#d9a21b']];
let saya = { nama:'', avatar:AVATAR[0][1], email:'' }, db = null, galeri = [], draf = null, token = '';
let praMuat = null, dataAwal = null;   // v2.22: data pameran yang dimuat lebih awal (praMuat) dan diteruskan ke museum.js (dataAwal)
let halaman = 0, zonaAktif = 'A', sudahMasuk = false; const PER = 12;
const $ = id => document.getElementById(id);
function pesan(t, ms=4000){ const p=$('pesan'); p.textContent=t; p.style.display='block'; clearTimeout(pesan.t); pesan.t=setTimeout(()=>p.style.display='none',ms); }

/* v2.17: pesan teknis hanya untuk staf (manajer ke atas); siswa mendapat pesan ramah. */
const staf = () => ['manajer','admin','pemilik'].indexOf(saya.peran) >= 0;
/* v2.17 T08: nama tampil = huruf Latin, angka, spasi, titik, apostrof, tanda hubung; maksimal 20 (sama dengan aturan server) */
function namaAman(s){ return String(s==null?'':s).normalize('NFC').replace(/[^\p{Script=Latin}0-9 .'-]/gu,'').replace(/ {2,}/g,' ').trim().slice(0,20); }

/* Panggilan ke Apps Script. text/plain menghindari preflight CORS. */
async function gs(fn, ...args){
  let r;
  try{
    r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ token, fn, args }) });
  }catch(e){ throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.'); }
  let j; try{ j = await r.json(); }catch(e){ throw new Error('Balasan server tidak terbaca.'); }
  if(j.ok) return j.data;
  if(j.kode==='AUTH'){ keLogin('Sesi habis. Masuk lagi dengan Google.'); }
  throw new Error(j.error||'Terjadi kesalahan.');
}

/* ----- Login Google ----- */
function keLogin(info){
  sudahMasuk=false; token=''; praMuat=null; try{ sessionStorage.removeItem('rr_token'); }catch(e){}
  $('lobi').style.display='none'; $('hud').style.display='none'; $('studio').style.display='none';
  $('login').style.display='block'; $('masuk').disabled=false;
  if(info) pesan(info,7000);
}
function bacaToken(t){ try{ const p=JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); return p; }catch(e){ return null; } }
async function setelahLogin(t){
  if(sudahMasuk) return;   // cegah callback Google ganda memunculkan lobi lagi
  const p=bacaToken(t); if(!p||p.exp*1000<Date.now()) return keLogin('Sesi habis. Masuk lagi dengan Google.');
  token=t; try{ sessionStorage.setItem('rr_token',t); }catch(e){}
  try{
    const r=await gs('getProfile');
    cekVersiServer(r.versi);
    saya.email=r.email; saya.id=r.id; saya.peran=r.peran; saya.kelas=r.kelas; $('akun').textContent='Masuk sebagai '+r.email.replace('#pw',' (akun sandi)');
    if(false){   /* v2.09: siswa tidak memilih kelas di lobi; kelas diatur guru di Panel Admin */ const ks=await gs('getKelasAktif'), sel=$('kelas'); sel.innerHTML=''; sel.add(new Option('Pilih kelas...',''));
      ks.forEach(k=>sel.add(new Option(k.nama,k.id))); $('kelasBox').style.display='block'; } else $('kelasBox').style.display='none';
    if(r.profile){ $('nama').value=r.profile.nama; saya.avatar=r.profile.avatar; tandaiAvatar(); }
    if(sudahMasuk) return;
    $('login').style.display='none'; $('lobi').style.display='block';
    /* v2.22: selagi siswa mengisi nama/avatar, ambil galeri + koleksi + poin (satu panggilan). Server lama tanpa fungsi ini: hasil null, dipakai jalur lama saat masuk. */
    praMuat={ t:Date.now(), p:gs('dataPameran').catch(()=>null) };
  }catch(e){ if(token) pesan(e.message,9000); }
}
/* Label versi: tampilkan versi server (Code.gs) dan peringatkan bila berbeda dari halaman */
function cekVersiServer(v){
  try{ const e=$('ver'); e.textContent=e.textContent.replace(/ \u00b7 server .*$/,'')+' \u00b7 server '+(v||'lama'); }catch(e){}
  if(v!==VERSI){ if(!staf()){ try{ console.warn('Versi server '+(v||'lama')+' berbeda dari halaman '+VERSI); }catch(e){} return; }
    pesan('Server (Apps Script) berversi '+(v||'lama')+', halaman berversi '+VERSI+'. Minta pemilik memasang Code.gs terbaru (Deploy > New version).',12000); }
}
function infoLogin(t){ $('infoLogin').textContent=t; }
function mulaiGoogle(){
  if(location.protocol==='file:'){ return infoLogin('Halaman dibuka dari file di komputer. Tombol Google hanya jalan dari alamat web (https://... atau http://localhost). Unggah ke GitHub Pages/Firebase Hosting, atau jalankan server lokal.'); }
  if(GOOGLE_CLIENT_ID.indexOf('ISI_')===0||API_URL.indexOf('ISI_')===0){ return infoLogin('Konfigurasi belum diisi: ganti API_URL dan GOOGLE_CLIENT_ID di bagian KONFIGURASI pada Index.html.'); }
  if(!window.google||!google.accounts){
    mulaiGoogle.n=(mulaiGoogle.n||0)+1;
    if(mulaiGoogle.n>50) return infoLogin('Skrip Google (accounts.google.com/gsi/client) gagal dimuat. Periksa koneksi internet atau pemblokir iklan/ekstensi.');
    return setTimeout(mulaiGoogle,200);
  }
  infoLogin('');
  google.accounts.id.initialize({ client_id:GOOGLE_CLIENT_ID, callback:r=>setelahLogin(r.credential), auto_select:false, cancel_on_tap_outside:false });
  google.accounts.id.renderButton($('tombolGoogle'),{ theme:'outline', size:'large', text:'signin_with', shape:'pill', locale:'id', width:280 });
  let simpan=''; try{ simpan=sessionStorage.getItem('rr_token')||''; }catch(e){}
  const p=simpan&&bacaToken(simpan);
  if(p&&p.exp*1000>Date.now()+60000) setelahLogin(simpan);
}
$('keluar').onclick=()=>{ if(window.google&&google.accounts) google.accounts.id.disableAutoSelect(); keLogin(); };
window.addEventListener('load',mulaiGoogle);

/* Lobi */
function tandaiAvatar(){ document.querySelectorAll('#avatars button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.c===saya.avatar))); }
AVATAR.forEach(([n,c])=>{ const b=document.createElement('button'); b.textContent=n; b.dataset.c=c; b.style.background=c;
  b.onclick=()=>{ saya.avatar=c; tandaiAvatar(); }; $('avatars').append(b); });
tandaiAvatar();
/* v2.22: data masuk pameran. Jalur cepat: data lobi (maks 60 dtk) + saveAvatar. Jalur biasa: masukPameran (satu panggilan). Server lama: tiga panggilan seperti dahulu. */
async function ambilDataMasuk(){
  const pra=praMuat; praMuat=null;
  if(pra && Date.now()-pra.t<60000){
    let d=null; try{ d=await pra.p; }catch(e){}
    if(d){ await gs('saveAvatar', saya.nama, saya.avatar); return d; }
  }
  try{ return await gs('masukPameran', saya.nama, saya.avatar); }
  catch(e){ if(!/Fungsi tidak dikenal/.test(e.message)) throw e;
    await gs('saveAvatar', saya.nama, saya.avatar); return { galeri: await gs('getGallery'), koleksi:null, poin:null }; }
}
$('masuk').onclick = async () => {
  saya.nama = namaAman($('nama').value); $('nama').value = saya.nama; if(!saya.nama) return pesan('Isi nama panggilan dahulu (huruf latin dan angka).');
  if($('kelasBox').style.display==='block'&&!$('kelas').value) return pesan('Pilih kelas dahulu.');
  $('masuk').disabled = true; $('memuat').style.display = 'flex';
  try{
    if($('kelasBox').style.display==='block'){ await gs('pilihKelas',$('kelas').value); $('kelasBox').style.display='none'; }
    const d = await ambilDataMasuk();
    $('lobi').style.display='none'; $('hud').style.display='flex'; sudahMasuk=true;
    galeri = d.galeri; dataAwal = { koleksi:d.koleksi, poin:d.poin };
    await mulaiMuatMuseum(); try{ renderJeda(false); $('scene').play(); }catch(e){}
    await bangunMuseum(); bangunGaleri(); mulaiMultiplayer(); pindah('A'); if(window.siapkanAdmin) siapkanAdmin(); $('lobi').style.display='none';
  }catch(e){ $('masuk').disabled=false; sudahMasuk=false; dataAwal=null; $('hud').style.display='none'; $('lobi').style.display='block'; pesan(e.message,8000); }
  finally{ $('memuat').style.display = 'none'; }
};

/* Zona */
const POS = { A:[0,0,6], C:[-30,0,6], D:[30,0,6] };
function pindah(z){ zonaAktif=z; $('rig').setAttribute('position', POS[z].join(' ')); $('studio').style.display = z==='C'?'block':'none'; }
document.querySelectorAll('[data-zona]').forEach(b=>b.onclick=()=>pindah(b.dataset.zona));

/* v2.16: Galeri Bersama lama (zona di luar gedung) dihapus. Karya siswa tampil di Sayap Karya Siswa (museum.js: isiSayap) */
function bangunGaleri(){ if(typeof isiSayap==='function') isiSayap(); }
async function muatGaleri(){ galeri = await gs('getGallery'); }
setInterval(async()=>{ if(zonaAktif!=='D'||document.hidden||!token) return; try{ await muatGaleri(); bangunGaleri(); }catch(e){} }, 45000);
$('prev').onclick=()=>{ if(halaman>0){ halaman--; bangunGaleri(); } };
$('next').onclick=()=>{ halaman++; bangunGaleri(); };

/* Zona C */
$('buat').onclick = async () => {
  const t=$('tema').value.trim(); if(!t) return pesan('Isi tema karya dahulu.');
  $('buat').disabled=true; $('hasil').textContent='Sedang membuat gambar (sekitar 10-30 detik)...';
  try{
    draf = await gs('generateArt', t, $('aliran').value, $('palet').value, $('detail').value);
    $('hasil').innerHTML=`<img src="${draf.url}" alt="Hasil gambar"><p>Sisa jatah hari ini: ${draf.sisa}</p>
      <button id="pajang">Pajang di pameran</button> <button id="ulang" class="alt">Coba lagi</button>`;
    $('pajang').onclick=async(ev)=>{ ev.target.disabled=true;
      try{ const st=await gs('pajangKarya',draf.url);
        pesan(st==='disetujui'?'Karya dipajang di Galeri Karya Siswa.':'Karya dikirim ke guru dan tampil setelah disetujui.',7000);
        $('hasil').textContent=''; await muatGaleri(); bangunGaleri(); pindah('D');
      }catch(e){ ev.target.disabled=false; pesan(e.message); } };
    $('ulang').onclick=async(ev)=>{ ev.target.disabled=true;
      try{ await gs('arsipkanKarya',draf.url); $('hasil').textContent='Karya disimpan ke arsip. Ubah isian lalu buat lagi.'; }
      catch(e){ ev.target.disabled=false; pesan(e.message); } };
  }catch(e){ $('hasil').textContent=e.message; }
  $('buat').disabled=false;
};

/* Multiplayer (Firebase) - hemat bandwidth:
   - kirim posisi maksimal 1x/2 detik, dan hanya jika benar-benar bergerak/menoleh
   - dengarkan perubahan per-pemain (child_*), bukan seluruh node 'posisi' */
async function mulaiMultiplayer(){
  if(!FB.databaseURL) return staf()&&pesan('Firebase belum dikonfigurasi: multiplayer nonaktif.',6000);
  if(!saya.id) return;   // v2.14: kunci Firebase = ID anonim dari server (email tidak lagi dikirim ke klien lain)
  try{ await muatFirebase(); }catch(e){ console.warn(e.message); if(staf()) pesan('Firebase gagal dimuat: multiplayer nonaktif.',8000); return; }   // v2.22: skrip Firebase dimuat saat dibutuhkan
  firebase.initializeApp(FB); db=firebase.database();
  const id=saya.id, ref=db.ref('posisi/'+id);
  const r2=v=>Math.round(v*100)/100;
  const warna=/^#[0-9a-f]{6}$/i.test(saya.avatar)?saya.avatar:'#c0392b';
  let last=null, tulisAkhir=0, galatMP=false;
  const kirim=(paksa)=>{ if(document.hidden) return;
    const p=$('rig').object3D.position, ry=$('cam').object3D.rotation.y;
    const cur={x:r2(p.x),y:r2(p.y),z:r2(p.z),ry:r2(ry)};
    // v2.15: tulis ulang tiap 15 dtk walau diam (denyut), supaya avatar tidak hilang bila koneksi sempat putus dan node dihapus server (onDisconnect)
    if(!paksa && last && Math.abs(cur.x-last.x)<0.1 && Math.abs(cur.z-last.z)<0.1 && Math.abs(cur.ry-last.ry)<0.1 && Date.now()-tulisAkhir<15000) return;
    last=cur; tulisAkhir=Date.now();
    // n dikosongkan: nama TIDAK dipercaya dari klien, diambil dari server. t = waktu server (untuk membuang avatar basi).
    const p2=ref.set(Object.assign({n:'',c:warna,t:firebase.database.ServerValue.TIMESTAMP},cur));
    if(p2&&p2.catch) p2.catch(e=>{ if(galatMP) return; galatMP=true; if(staf()) pesan('Posisimu tidak terkirim ke Firebase ('+((e&&e.code)||'galat')+'), jadi pemain lain tidak melihat avatarmu. Periksa Rules Firebase.',14000); else console.warn('Posisi tidak terkirim',e&&e.code); }); };
  // sambung ulang: pasang lagi onDisconnect dan tulis ulang posisi setiap kali terhubung (juga saat pertama)
  db.ref('.info/connected').on('value',s=>{ if(s.val()===true){ ref.onDisconnect().remove(); kirim(true); } });
  let selisih=0; db.ref('.info/serverTimeOffset').on('value',s=>{ selisih=Number(s.val())||0; });
  const segar=o=>Number(o&&o.t)>0 && (Date.now()+selisih-Number(o.t))<90000;
  kirim(true); setInterval(kirim,2000);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) ref.remove(); else { last=null; kirim(true); } });

  /* Pemain lain: badan sederhana + papan nama "Nama + poin" yang selalu menghadap kamera. Nama dan poin dari SERVER (getPapanNama, cache 45 dtk). */
  const lain={}, papan={}, sembunyi={}; let tunda=0;
  const tulisLabel=k=>{ const o=lain[k]; if(!o) return; const p=papan[k];
    o.teks.setAttribute('value', p ? (p.p>=0 ? namaAman(p.n)+'\n'+p.p+' poin' : namaAman(p.n)) : 'Pemain'); };
  const muatPapan=async()=>{ const ids=Object.keys(lain).slice(0,80); if(!ids.length||!token||document.hidden) return;
    try{ const r=await gs('getPapanNama',ids); Object.keys(r).forEach(k=>{ papan[k]=r[k]; if(r[k].t&&saya.peran==='siswa'){ sembunyi[k]=true; buang(k); } }); ids.forEach(tulisLabel); }catch(e){} };   // v2.17 T06: avatar tamu tidak tampil bagi siswa
  const jadwalPapan=()=>{ clearTimeout(tunda); tunda=setTimeout(muatPapan,1200); };
  setInterval(muatPapan,40000);
  setInterval(()=>{ if(document.hidden) return; const c=$('rig').object3D.position;
    Object.keys(lain).forEach(k=>{ const lb=lain[k].lb, p=lb.object3D.position; lb.object3D.rotation.y=Math.atan2(c.x-p.x,c.z-p.z); }); },120);
  const batas=v=>Math.max(-60,Math.min(60,Number(v)||0));
  const buang=k=>{ const o=lain[k]; if(o){ o.e.remove(); o.lb.remove(); delete lain[k]; } };
  setInterval(()=>{ Object.keys(lain).forEach(k=>{ if(!segar(lain[k].o)) buang(k); }); },30000);   // avatar tanpa denyut >90 dtk dibuang
  const taruh=s=>{ const k=s.key; if(k===id||sembunyi[k]) return; const o=s.val(); if(!o) return;
    if(!segar(o)){ buang(k); return; }
    if(!lain[k]){ const e=document.createElement('a-entity'), w=/^#[0-9a-f]{6}$/i.test(o.c)?o.c:'#888888';
      const t=(induk,tag,at)=>{ const q=document.createElement(tag); for(const n in at) q.setAttribute(n,at[n]); induk.append(q); return q; };
      t(e,'a-sphere',{radius:0.3,position:'0 1.5 0',color:w}); t(e,'a-cylinder',{radius:0.25,height:1,position:'0 0.7 0',color:w});
      const lb=document.createElement('a-entity'); t(lb,'a-plane',{width:1.9,height:0.62,color:'#1d1812',opacity:0.7,transparent:true});
      const teks=t(lb,'a-text',{value:'Pemain',align:'center',width:2.6,position:'0 0 0.01',color:'#ffffff'});
      $('lain').append(e); $('lain').append(lb); lain[k]={e,lb,teks,o}; tulisLabel(k); jadwalPapan(); }
    lain[k].o=o;
    const px=batas(o.x), pz=batas(o.z);
    const py=Math.max(-1,Math.min(1,Number(o.y)||0));   // v2.18 T11: ikut tinggi undak (abaikan mode 'dari atas')
    lain[k].e.setAttribute('position',`${px} ${py} ${pz}`);
    lain[k].e.setAttribute('rotation',`0 ${(Number(o.ry)||0)*57.3} 0`);
    lain[k].lb.setAttribute('position',`${px} ${2.3+py} ${pz}`); };
  db.ref('posisi').on('child_added',taruh);
  db.ref('posisi').on('child_changed',taruh);
  db.ref('posisi').on('child_removed',s=>buang(s.key));
}
/* ===== v2.22: pemuat skrip berat =====
   A-Frame (>1 MB) dan Firebase tidak lagi di <head>, jadi halaman login langsung tampil. Setelah halaman selesai dimuat, A-Frame, museum.js dan admin.js
   diunduh di latar belakang; tombol "Masuk pameran" menunggu bila belum selesai. Adegan 3D dijeda sampai siswa masuk (hemat baterai/GPU di HP). */
const SKRIP_AFRAME='https://aframe.io/releases/1.5.0/aframe.min.js', SKRIP_FB=['https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js','https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js'];
const _sekali={};
function muatSekali(src){ return _sekali[src]||(_sekali[src]=new Promise((ok,gagal)=>{ const s=document.createElement('script'); s.src=src; s.onload=()=>ok();
  s.onerror=()=>{ delete _sekali[src]; s.remove(); gagal(new Error('Gagal memuat '+src.split('/').pop().split('?')[0]+'. Periksa koneksi internet lalu coba lagi.')); }; document.head.append(s); })); }
async function muatFirebase(){ await muatSekali(SKRIP_FB[0]); await muatSekali(SKRIP_FB[1]); }
/* v2.22: suntik <a-scene> dari template, di tempat yang sama dalam urutan DOM. Perangkat sentuh: tanpa antialias (hemat render). */
function pasangScene(){
  if($('scene')) return;
  const t=$('tplScene'), sc=t.content.querySelector('#scene');
  if(matchMedia('(pointer:coarse)').matches) sc.setAttribute('renderer','antialias:false;maxCanvasWidth:1280;maxCanvasHeight:1280');
  t.after(t.content.cloneNode(true));
}
let _renderBerhenti=false;
/* v2.22: scene.pause() milik A-Frame hanya menghentikan tick komponen; penggambaran 3D tetap jalan tiap frame. Fungsi ini benar-benar menghentikannya
   (dipakai saat panel admin terbuka dan di layar login). */
function renderJeda(henti){
  const sc=$('scene'); if(!sc||!sc.renderer||!sc.renderStarted) return;
  try{
    if(henti){ if(sc.is('vr-mode')) return; sc.renderer.setAnimationLoop(null); _renderBerhenti=true; }
    else if(_renderBerhenti){ sc.renderer.setAnimationLoop(sc.render); _renderBerhenti=false; }
  }catch(e){}
}
addEventListener('resize',()=>{ if(!_renderBerhenti) return; setTimeout(()=>{ try{ const sc=$('scene'); sc.renderer.render(sc.object3D,sc.camera); }catch(e){} },80); });
function jedaScene(){ const sc=$('scene'), kini=()=>{ try{
    if(matchMedia('(pointer:coarse)').matches&&sc.renderer){ sc.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); sc.resize(); }   // HP: maks 2 piksel per titik layar
    if(!sudahMasuk){ sc.pause(); const henti=()=>setTimeout(()=>{ if(!sudahMasuk) renderJeda(true); },1500); if(sc.renderStarted) henti(); else sc.addEventListener('renderstart',henti,{once:true}); } }catch(e){} };
  if(sc.hasLoaded) kini(); else sc.addEventListener('loaded',kini,{once:true}); }
let _muatMuseum=null;
function mulaiMuatMuseum(){
  if(_muatMuseum) return _muatMuseum;
  _muatMuseum=(async()=>{
    await muatSekali(SKRIP_AFRAME); pasangScene(); jedaScene();
    await muatSekali('museum.js?v=2.22'); await muatSekali('admin.js?v=2.22');
    if(FB.databaseURL) muatFirebase().catch(()=>{});   // unduh Firebase di latar belakang; galat ditangani saat mulaiMultiplayer
  })();
  _muatMuseum.catch(()=>{ _muatMuseum=null; });
  return _muatMuseum;
}
window.addEventListener('load',()=>setTimeout(()=>{ mulaiMuatMuseum().catch(()=>{}); },300));
window.addEventListener('error',e=>{ try{ if(staf()) pesan('Galat skrip: '+e.message+' ('+String(e.filename||'').split('/').pop()+':'+e.lineno+')',12000); else { console.error(e.message); pesan('Ada gangguan. Muat ulang halaman.',8000); } }catch(x){} });
</script>
